<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Fare BD</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1 id="title">Launch Fare BD</h1>
  <p id="subtitle" class="subtitle"></p>
  <button id="langBtn" type="button">&#x09ac;&#x09be;&#x0982;&#x09b2;&#x09be;</button>
</header>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="calc" class="active"></button>
  <button type="button" data-tab="table"></button>
  <button type="button" data-tab="formula"></button>
  <button type="button" data-tab="classes"></button>
  <button type="button" data-tab="rules"></button>
  <button type="button" data-tab="data"></button>
</nav>

<main>
<section id="tab-calc" class="panel active">
  <div class="row">
    <label><span data-i18n="from"></span>
      <select id="fromSelect"></select>
    </label>
    <button id="swapBtn" type="button" data-i18n="swap"></button>
    <label><span data-i18n="to"></span>
      <select id="toSelect"></select>
    </label>
  </div>
  <div class="row">
    <label><span data-i18n="route"></span>
      <select id="routeSelect"></select>
    </label>
    <label><span data-i18n="travelClass"></span>
      <select id="classSelect"></select>
    </label>
  </div>
  <div class="row">
    <label><span data-i18n="adults"></span>
      <input id="adultsInput" type="number" min="0" max="6" step="1" value="1">
    </label>
    <label><span data-i18n="children512"></span>
      <input id="children512Input" type="number" min="0" max="4" step="1" value="0">
    </label>
    <label><span data-i18n="under5"></span>
      <input id="under5Input" type="number" min="0" max="4" step="1" value="0">
    </label>
  </div>
  <p id="childNote" class="note"></p>
  <button id="calcBtn" type="button" data-i18n="calcBtn"></button>
  <p id="calcError" class="error" hidden></p>
  <div id="resultBox" hidden>
    <h2 id="resultTitle"></h2>
    <p id="resultRoute"></p>
    <table class="breakdown">
      <tbody id="breakdownBody"></tbody>
      <tfoot>
        <tr><th id="totalLabel"></th><td id="grandTotalCell"></td></tr>
      </tfoot>
    </table>
    <p id="rangeNote" class="note" hidden></p>
    <p id="roundingNote" class="note" hidden></p>
    <div class="row">
      <input id="calcName" type="text" maxlength="60">
      <button id="saveCalcBtn" type="button" data-i18n="saveBtn"></button>
    </div>
    <p id="saveMsg" class="ok" hidden></p>
  </div>
</section>

<section id="tab-table" class="panel">
  <h2 id="tableTitle"></h2>
  <input id="tableSearch" type="search">
  <p id="tableCount"></p>
  <table class="fare-table">
    <thead><tr><th id="thRoute"></th><th id="thClass"></th><th id="thFare"></th><th id="thBadge"></th></tr></thead>
    <tbody id="fareTableBody"></tbody>
  </table>
</section>

<section id="tab-formula" class="panel">
  <h2 id="formulaTitle"></h2>
  <p id="formulaDesc"></p>
  <div class="row">
    <label><span data-i18n="distanceLabel"></span>
      <input id="distanceInput" type="number" min="1" max="1000" step="1" placeholder="180">
    </label>
    <button id="formulaBtn" type="button" data-i18n="formulaBtn"></button>
  </div>
  <p id="formulaError" class="error" hidden></p>
  <p id="formulaResult" class="big" hidden></p>
  <p id="formulaNote" class="note"></p>
</section>

<section id="tab-classes" class="panel">
  <h2 id="classesTitle"></h2>
  <div id="classList" class="cards"></div>
</section>

<section id="tab-rules" class="panel">
  <h2 id="rulesTitle"></h2>
  <ol id="rulesList"></ol>
</section>

<section id="tab-data" class="panel">
  <h2 id="dataTitle"></h2>
  <div id="savedList"></div>
  <p id="savedEmpty" class="note" hidden></p>
  <div class="row">
    <button id="exportBtn" type="button" data-i18n="exportBtn"></button>
  </div>
  <textarea id="importText" rows="4"></textarea>
  <div class="row">
    <button id="importBtn" type="button" data-i18n="importBtn"></button>
  </div>
  <p id="importOk" class="ok" hidden></p>
  <p id="importFail" class="error" hidden></p>
  <h3 id="eraseTitle"></h3>
  <p id="eraseLabel" class="note"></p>
  <div class="row">
    <input id="eraseInput" type="text" placeholder="DELETE">
    <button id="eraseBtn" type="button" data-i18n="eraseBtn"></button>
  </div>
  <p id="eraseWrong" class="error" hidden></p>
  <p id="erasedMsg" class="ok" hidden></p>
</section>
</main>

<footer><p id="footerText"></p></footer>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
